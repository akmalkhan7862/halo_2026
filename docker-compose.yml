version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume_platform_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: resume_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_platform_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/resume_platform
      - SECRET_KEY=production_secret_key_change_me_32chars!
      - LLM_PROVIDER=openai
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=gpt-4o-mini
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_platform_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
